<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Kidsnesia</title>
    <link rel="stylesheet" href="hubungi-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    <div class="container">
        <header class="navbar">
            <div class="navbar-content">
                <div class="logo">
                    <a href="index.html"><img src="assets/Logo.png" alt="Logo Kidsnesia"></a>
                </div>
            <nav class="nav-links">
                <a href="index.html">Beranda</a>
                <a href="program.html">Program</a>
                <a href="hubungi.html" class="active">Hubungi</a>
                <a href="#" id="user-link" title="Login"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-user-round-icon lucide-circle-user-round"><path d="M18 20a6 6 0 0 0-12 0"/><circle cx="12" cy="10" r="4"/><circle cx="12" cy="12" r="10"/></svg></a>
            </nav>
            </div>
        </header>

        <div class="form-container">
            <div class="form-section">
                <h1><span>Hubungi</span> <strong>Kami</strong></h1>
                <p>Yuk, sampaikan pertanyaan atau pesan kamu ke tim Kidsnesia. Kami siap membantu!</p>
                <form>
                    <input type="text" placeholder="Nama *" required>
                    <input type="email" placeholder="Email">
                    <input type="tel" placeholder="Nomor Handphone *" required>
                    <select required>
                        <option value="" disabled selected>Dari mana kamu tahu tentang kami?</option>
                        <option value="sosmed">Media Sosial</option>
                        <option value="teman">Teman/Keluarga</option>
                        <option value="iklan">Iklan</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                    <button type="submit">Kirim</button>
                </form>
                <div class="contact-info">
                    <div class="info">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-phone"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                        <div>
                            <p class="label">TELEPON</p>
                            <p>03 5432 1234</p>
                        </div>
                    </div>
                    <div class="info">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mail"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <div>
                            <p class="label">EMAIL</p>
                            <p>info@kidsnesia.id</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="map-section">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3982.2886217963396!2d98.6189041!3d3.5206122!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x303125e202b33e67%3A0x98d2d2fc9fa3c9ca!2sKidsnesia%20(Pusat%20Edukasi%20TK%20%26%20SD)!5e0!3m2!1sid!2sid!4v1747103151123!5m2!1sid!2sid" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>

    <script>document.addEventListener('DOMContentLoaded',()=>{ if(window.feather) feather.replace(); });</script>
    <script src="script.js"></script>
</body>
</html>
